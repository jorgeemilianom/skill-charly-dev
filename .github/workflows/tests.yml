name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar scripts
        run: python -m py_compile scripts/*.py
      - name: Tests (workspaces temporales, sin memoria real)
        run: python -m unittest discover -s tests -v
